<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile Dashboard | Aetheria</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">Home</a></li>
        <li><a href="/pages/product.html" class="nav-item">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/pages/cart.html" class="cart-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
        <ul class="nav-links" id="nav-auth-links" style="margin-left: 20px;">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Profile Content Grid Layout -->
  <main class="container product-detail-layout" style="margin: 40px auto; gap: 32px;">
    
    <!-- Profile Forms Column -->
    <section style="display:flex; flex-direction:column; gap:24px;">
      <!-- Profile Card -->
      <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 20px;">Update Profile Details</h2>
        <form id="profile-update-form">
          <div class="form-group">
            <label for="profile-name">Full Name</label>
            <input type="text" id="profile-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="profile-email">Email Address</label>
            <input type="email" id="profile-email" class="form-control" required>
          </div>
          
          <h3 style="font-size:14px; color: var(--text-secondary); margin: 20px 0 10px; text-transform:uppercase; font-weight:700;">Default Address</h3>
          <div class="form-group">
            <label for="profile-street">Street Address</label>
            <input type="text" id="profile-street" class="form-control" placeholder="123 Main St, Apt 4B">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="profile-city">City</label>
              <input type="text" id="profile-city" class="form-control" placeholder="New York">
            </div>
            <div class="form-group">
              <label for="profile-zip">Zip Code</label>
              <input type="text" id="profile-zip" class="form-control" placeholder="10001">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Save Changes</button>
        </form>
      </div>

      <!-- Password Change Card -->
      <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 20px;">Change Password</h2>
        <form id="password-change-form">
          <div class="form-group">
            <label for="pw-current">Current Password</label>
            <input type="password" id="pw-current" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="pw-new">New Password</label>
            <input type="password" id="pw-new" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">Change Password</button>
        </form>
      </div>
    </section>

    <!-- Orders History Column -->
    <section class="card" style="height: fit-content; display:flex; flex-direction:column; gap:16px;">
      <h2 style="font-size: 20px; margin-bottom: 8px;">Order History</h2>
      
      <div class="table-responsive">
        <table class="table" id="orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Total</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading order history...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Detailed Order Dialog Modal -->
  <div class="modal" id="order-detail-modal">
    <div class="card modal-content">
      <div class="modal-header">
        <h3 id="modal-order-title" style="font-size:20px;">Order Details</h3>
        <span class="close-btn" id="close-modal-btn">&times;</span>
      </div>
      <div id="modal-order-content" style="display:flex; flex-direction:column; gap:16px;">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. All rights reserved. Powered by Node.js & MongoDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { apiRequest, showToast } from '/js/api.js';
    import { isAuthenticated, updateProfile, changePassword } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      if (!isAuthenticated()) {
        window.location.href = '/pages/login.html';
        return;
      }

      loadProfileDetails();
      loadOrderHistory();

      // Hook profile submission
      document.getElementById('profile-update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('profile-name').value;
        const email = document.getElementById('profile-email').value;
        const street = document.getElementById('profile-street').value;
        const city = document.getElementById('profile-city').value;
        const zip = document.getElementById('profile-zip').value;

        const address = { street, city, zip };
        await updateProfile({ name, email, address });
      });

      // Hook password submission
      document.getElementById('password-change-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('pw-current').value;
        const newPassword = document.getElementById('pw-new').value;

        const success = await changePassword(currentPassword, newPassword);
        if (success) {
          document.getElementById('pw-current').value = '';
          document.getElementById('pw-new').value = '';
        }
      });

      // Close modal events
      document.getElementById('close-modal-btn').addEventListener('click', () => {
        document.getElementById('order-detail-modal').style.display = 'none';
      });

      window.addEventListener('click', (e) => {
        const modal = document.getElementById('order-detail-modal');
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      });
    });

    async function loadProfileDetails() {
      try {
        const res = await apiRequest('/api/auth/me');
        if (res.success) {
          const user = res.data;
          document.getElementById('profile-name').value = user.name || '';
          document.getElementById('profile-email').value = user.email || '';
          if (user.address) {
            document.getElementById('profile-street').value = user.address.street || '';
            document.getElementById('profile-city').value = user.address.city || '';
            document.getElementById('profile-zip').value = user.address.zip || '';
          }
        }
      } catch (err) {
        console.error('Profile query error', err);
      }
    }

    async function loadOrderHistory() {
      const tbody = document.getElementById('orders-tbody');
      try {
        const res = await apiRequest('/api/orders/my');
        if (res.success) {
          if (res.data.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 24px;">
                  No past orders found. Keep exploring our shop catalog!
                </td>
              </tr>
            `;
            return;
          }

          tbody.innerHTML = res.data.map(order => {
            const dateStr = new Date(order.createdAt).toLocaleDateString();
            const badgeClass = `badge badge-${order.status}`;
            return `
              <tr>
                <td style="font-family: monospace; font-size:12px;">#${order._id.substring(18)}</td>
                <td>${dateStr}</td>
                <td style="font-weight:700;">$${order.totalAmount.toFixed(2)}</td>
                <td><span class="${badgeClass}">${order.status}</span></td>
                <td><button class="btn btn-secondary btn-sm" onclick="viewOrderDetails('${order._id}')">View</button></td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: var(--danger-color); padding: 24px;">
              Error loading order history.
            </td>
          </tr>
        `;
      }
    }

    // Modal details trigger
    window.viewOrderDetails = async (orderId) => {
      const modal = document.getElementById('order-detail-modal');
      const content = document.getElementById('modal-order-content');
      const title = document.getElementById('modal-order-title');

      modal.style.display = 'flex';
      content.innerHTML = '<p>Retrieving order details...</p>';
      title.innerText = `Order #${orderId.substring(12)}`;

      try {
        const res = await apiRequest(`/api/orders/${orderId}`);
        if (res.success) {
          const order = res.data;
          const itemsHtml = order.items.map(item => `
            <div class="flex-between" style="border-bottom:1px solid var(--border-color); padding:8px 0; font-size:14px;">
              <span>${item.name} <span style="font-weight:700;">x${item.qty}</span></span>
              <span>$${(item.qty * item.price).toFixed(2)}</span>
            </div>
          `).join('');

          content.innerHTML = `
            <div>
              <p style="font-size:13px; color: var(--text-secondary); margin-bottom: 4px;">Status: <span class="badge badge-${order.status}">${order.status}</span></p>
              <p style="font-size:13px; color: var(--text-secondary); margin-bottom: 12px;">Placed on: ${new Date(order.createdAt).toLocaleString()}</p>
            </div>
            
            <div style="border-top:1px solid var(--border-color); padding-top:12px;">
              <h4 style="font-size:14px; margin-bottom:8px; text-transform:uppercase; color:var(--text-secondary);">Ordered Items</h4>
              ${itemsHtml}
            </div>

            <div style="margin-top: 12px; background-color: var(--bg-input); padding: 12px; border-radius: var(--border-radius-sm);">
              <h4 style="font-size:13px; margin-bottom:6px; text-transform:uppercase; color:var(--text-secondary);">Shipping Details</h4>
              <p style="font-size:13px;">${order.shippingAddress.street}</p>
              <p style="font-size:13px;">${order.shippingAddress.city}, ${order.shippingAddress.zip}</p>
            </div>

            <div class="flex-between" style="font-weight:700; font-size:18px; border-top:1px solid var(--border-color); padding-top:16px;">
              <span>Total amount:</span>
              <span>$${order.totalAmount.toFixed(2)}</span>
            </div>
          `;
        }
      } catch (err) {
        content.innerHTML = '<p style="color:var(--danger-color);">Failed to load order receipt.</p>';
      }
    };
  </script>
</body>
</html>
