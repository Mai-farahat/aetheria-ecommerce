<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success | Aetheria</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">Home</a></li>
        <li><a href="/pages/product.html" class="nav-item">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/pages/cart.html" class="cart-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
        <ul class="nav-links" id="nav-auth-links" style="margin-left: 20px;">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Success Status Center Card -->
  <main class="container" style="max-width: 600px; margin: 80px auto;">
    <div class="card" id="success-card" style="text-align: center; padding: 48px;">
      <div class="flex-center" style="margin-bottom: 24px;">
        <!-- Loading spinner -->
        <div style="border: 4px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite;"></div>
      </div>
      <h2 style="font-size: 22px; margin-bottom: 8px;">Verifying Secure Payment...</h2>
      <p style="color: var(--text-secondary);">Please wait while we verify your transaction status.</p>
    </div>
  </main>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. All rights reserved. Powered by Node.js & MongoDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { apiRequest } from '/js/api.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const sessionId = new URLSearchParams(window.location.search).get('session_id');
      const card = document.getElementById('success-card');

      if (!sessionId) {
        card.innerHTML = `
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--danger-color)" stroke-width="1.5" style="margin-bottom: 16px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h2 style="font-size: 24px; margin-bottom: 8px; color: var(--danger-color);">Verification Error</h2>
          <p style="color: var(--text-secondary); margin-bottom: 24px;">No checkout session ID found in the URL. Please verify your connection.</p>
          <a href="/pages/index.html" class="btn btn-primary" style="width: 100%;">Return to Home</a>
        `;
        return;
      }

      try {
        // Verify payment session status via endpoint
        const res = await apiRequest(`/api/payments/verify/${sessionId}`);

        if (res.success) {
          card.innerHTML = `
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5" style="margin-bottom: 16px;">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <h2 style="font-size: 26px; margin-bottom: 8px; color: var(--accent-color);">Order Placed Successfully!</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Thank you for your purchase. Your payment was verified and your order is now in preparation.</p>
            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom: 32px;">
              <a href="/pages/profile.html" class="btn btn-primary">Track Order Status</a>
              <a href="/pages/product.html" class="btn btn-secondary">Continue Shopping</a>
            </div>
          `;
        }
      } catch (err) {
        card.innerHTML = `
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--danger-color)" stroke-width="1.5" style="margin-bottom: 16px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h2 style="font-size: 24px; margin-bottom: 8px; color: var(--danger-color);">Payment Verification Failed</h2>
          <p style="color: var(--text-secondary); margin-bottom: 24px;">${err.message || 'We could not verify your payment transaction.'}</p>
          <a href="/pages/cart.html" class="btn btn-primary" style="width: 100%;">Back to Cart</a>
        `;
      }
    });
  </script>
</body>
</html>
