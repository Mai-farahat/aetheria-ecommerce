<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Aetheria</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">Home</a></li>
        <li><a href="/pages/product.html" class="nav-item">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/pages/cart.html" class="cart-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
        <ul class="nav-links" id="nav-auth-links" style="margin-left: 20px;">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <main class="auth-container">
    <div class="card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-secondary);">Enter your credentials to sign in</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; height: 44px;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/pages/register.html" id="register-redirect-link">Register Here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. All rights reserved. Powered by Node.js & MongoDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { login, isAuthenticated } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '';

      // Set correct redirection link on register anchor
      if (redirect) {
        document.getElementById('register-redirect-link').href = `/pages/register.html?redirect=${encodeURIComponent(redirect)}`;
      }

      // If already logged in, redirect
      if (isAuthenticated()) {
        window.location.href = redirect ? decodeURIComponent(redirect) : '/pages/index.html';
        return;
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        // Execute login
        await login(email, password);
      });
    });
  </script>
</body>
</html>
