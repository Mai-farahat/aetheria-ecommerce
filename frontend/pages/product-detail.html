<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Aetheria</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">Home</a></li>
        <li><a href="/pages/product.html" class="nav-item">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/pages/cart.html" class="cart-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
        <ul class="nav-links" id="nav-auth-links" style="margin-left: 20px;">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Product Detail Section -->
  <main class="container">
    <div class="product-detail-layout" id="product-detail-container">
      <div class="card" style="grid-column: 1/-1; text-align:center; padding: 50px;">Fetching Details...</div>
    </div>

    <!-- Reviews Section -->
    <section class="reviews-section">
      <div class="product-detail-layout" style="gap: 32px;">
        <!-- Left column: reviews list -->
        <div>
          <h2 style="font-size: 22px; margin-bottom: 24px;">Reviews & Ratings</h2>
          <div id="reviews-list">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Right column: write review form -->
        <div>
          <div class="card" id="write-review-card">
            <h2 style="font-size: 20px; margin-bottom: 16px;">Write a Customer Review</h2>
            <!-- Show login prompt if unauthenticated, else show review form -->
            <div id="review-form-area">
              <p style="color: var(--text-secondary);">Checking account status...</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. All rights reserved. Powered by Node.js & MongoDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { apiRequest, showToast } from '/js/api.js';
    import { isAuthenticated } from '/js/auth.js';

    const productId = new URLSearchParams(window.location.search).get('id');
    let currentProduct = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (!productId) {
        document.getElementById('product-detail-container').innerHTML = `
          <div class="card" style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--danger-color);">
            Invalid Product ID. Please go back to the catalog.
          </div>`;
        return;
      }

      loadProductDetails();
      loadProductReviews();
      setupReviewForm();
    });

    async function loadProductDetails() {
      const container = document.getElementById('product-detail-container');
      try {
        const res = await apiRequest(`/api/products/${productId}`);
        if (res.success) {
          currentProduct = res.data;
          const ratingStars = '★'.repeat(Math.round(currentProduct.rating)) + '☆'.repeat(5 - Math.round(currentProduct.rating));
          const img = (currentProduct.images && currentProduct.images.length > 0) ? currentProduct.images[0] : '';
          
          container.innerHTML = `
            <!-- Gallery column -->
            <div class="detail-gallery">
              <div class="main-image-wrapper">
                <img src="${img}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%231a1a2e%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236366f1%22 font-family=%22sans-serif%22 font-size=%2220%22 font-weight=%22bold%22>Aetheria</text></svg>';" class="main-image" alt="${currentProduct.name}">
              </div>
            </div>

            <!-- Details column -->
            <div class="detail-info">
              <div class="detail-category">${currentProduct.category ? currentProduct.category.name : 'Uncategorized'}</div>
              <h1 class="detail-title">${currentProduct.name}</h1>
              
              <div class="product-rating" style="font-size: 16px; margin-bottom: 20px;">
                ${ratingStars} <span style="color: var(--text-secondary); font-size:14px;">(${currentProduct.numReviews} customer reviews)</span>
              </div>

              <div class="detail-price">$${currentProduct.price.toFixed(2)}</div>
              
              <p class="detail-desc">${currentProduct.description}</p>

              <div class="form-group" style="margin-bottom: 24px;">
                <label>Availability:</label>
                <span style="font-weight: bold; color: ${currentProduct.stock > 0 ? 'var(--accent-color)' : 'var(--danger-color)'}">
                  ${currentProduct.stock > 0 ? `In Stock (${currentProduct.stock} left)` : 'Out of Stock'}
                </span>
              </div>

              ${currentProduct.stock > 0 ? `
                <div class="detail-action-row">
                  <div class="qty-selector">
                    <button class="qty-btn" id="qty-minus">-</button>
                    <input type="number" id="qty-input" class="qty-input" value="1" min="1" max="${currentProduct.stock}" readonly>
                    <button class="qty-btn" id="qty-plus">+</button>
                  </div>
                  <button class="btn btn-primary" id="add-to-cart-btn" style="flex:1;">Add to Cart</button>
                </div>
              ` : `
                <button class="btn btn-secondary" style="margin-bottom: 32px;" disabled>Out of Stock</button>
              `}
            </div>
          `;

          // Setup quantity buttons
          if (currentProduct.stock > 0) {
            const minusBtn = document.getElementById('qty-minus');
            const plusBtn = document.getElementById('qty-plus');
            const qtyInput = document.getElementById('qty-input');

            minusBtn.addEventListener('click', () => {
              let val = parseInt(qtyInput.value) - 1;
              if (val >= 1) qtyInput.value = val;
            });

            plusBtn.addEventListener('click', () => {
              let val = parseInt(qtyInput.value) + 1;
              if (val <= currentProduct.stock) qtyInput.value = val;
            });

            document.getElementById('add-to-cart-btn').addEventListener('click', async () => {
              const { addToCart } = await import('/js/cart.js');
              addToCart(currentProduct, parseInt(qtyInput.value));
            });
          }

        }
      } catch (err) {
        container.innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center; padding: 50px; color:var(--danger-color);">Error fetching details.</div>`;
      }
    }

    async function loadProductReviews() {
      const listContainer = document.getElementById('reviews-list');
      try {
        const res = await apiRequest(`/api/products/${productId}/reviews`);
        if (res.success) {
          if (res.data.length === 0) {
            listContainer.innerHTML = '<p style="color: var(--text-secondary);">No reviews yet. Be the first to review this product!</p>';
            return;
          }

          listContainer.innerHTML = res.data.map(rev => {
            const stars = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating);
            const dateStr = new Date(rev.createdAt).toLocaleDateString('en-US', {
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            });
            return `
              <div class="review-item">
                <div class="review-meta">
                  <span class="review-user">${rev.user.name}</span>
                  <span class="review-rating">${stars}</span>
                </div>
                <div style="font-size:12px; color: var(--text-muted); margin-bottom: 8px;">Reviewed on ${dateStr}</div>
                <p class="review-comment">${rev.comment}</p>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        listContainer.innerHTML = '<p style="color: var(--danger-color);">Failed to load reviews.</p>';
      }
    }

    function setupReviewForm() {
      const area = document.getElementById('review-form-area');
      if (isAuthenticated()) {
        area.innerHTML = `
          <form id="submit-review-form">
            <div class="form-group">
              <label for="review-rating">Rating</label>
              <select id="review-rating" class="form-control" required style="width:100px;">
                <option value="5">5 Stars</option>
                <option value="4">4 Stars</option>
                <option value="3">3 Stars</option>
                <option value="2">2 Stars</option>
                <option value="1">1 Star</option>
              </select>
            </div>
            <div class="form-group">
              <label for="review-comment">Comment</label>
              <textarea id="review-comment" class="form-control" rows="4" placeholder="Share your experience with this product..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
          </form>
        `;

        document.getElementById('submit-review-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const rating = document.getElementById('review-rating').value;
          const comment = document.getElementById('review-comment').value;

          try {
            const res = await apiRequest(`/api/products/${productId}/reviews`, {
              method: 'POST',
              body: JSON.stringify({ rating, comment }),
            });

            if (res.success) {
              showToast('Review submitted successfully!', 'success');
              // Clear form
              document.getElementById('review-comment').value = '';
              // Reload details & reviews
              loadProductDetails();
              loadProductReviews();
            }
          } catch (err) {
            console.error('Review submit failed', err);
          }
        });
      } else {
        area.innerHTML = `
          <p style="color: var(--text-secondary); margin-bottom: 16px;">You must be logged in to write a review.</p>
          <a href="/pages/login.html?redirect=${encodeURIComponent(window.location.href)}" class="btn btn-secondary" style="width:100%; text-align:center;">Login to Review</a>
        `;
      }
    }
  </script>
</body>
</html>
