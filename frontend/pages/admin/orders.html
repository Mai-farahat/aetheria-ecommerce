<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders | Aetheria Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span> ADMIN</a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">View Site</a></li>
      </ul>
      <div class="nav-actions">
        <ul class="nav-links" id="nav-auth-links">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Admin Main Dashboard Container -->
  <main class="container admin-layout">
    
    <!-- Sidebar navigation -->
    <aside class="card admin-sidebar">
      <ul style="list-style: none;">
        <li><a href="/pages/admin/dashboard.html" class="admin-nav-item">Dashboard Overview</a></li>
        <li><a href="/pages/admin/products.html" class="admin-nav-item">Manage Products</a></li>
        <li><a href="/pages/admin/orders.html" class="admin-nav-item active">Manage Orders</a></li>
      </ul>
    </aside>

    <!-- Admin Content Area -->
    <section>
      <div class="section-header">
        <h1 class="section-title">Manage Orders</h1>
      </div>

      <!-- Orders List Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="table" id="admin-orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Total</th>
                <th>Shipping Address</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="admin-orders-tbody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-secondary);">Loading orders ledger...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. Admin operations center.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { apiRequest, showToast } from '/js/api.js';
    import { isAuthenticated, isAdmin } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Security Guard Route
      if (!isAuthenticated() || !isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }

      await loadAdminOrders();
    });

    async function loadAdminOrders() {
      const tbody = document.getElementById('admin-orders-tbody');
      try {
        const res = await apiRequest('/api/orders');
        if (res.success) {
          const orders = res.data;
          if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No orders registered yet.</td></tr>';
            return;
          }

          tbody.innerHTML = orders.map(order => {
            const dateStr = new Date(order.createdAt).toLocaleDateString();
            const customerName = order.user ? `${order.user.name} (${order.user.email})` : 'Unknown customer';
            const addr = order.shippingAddress ? `${order.shippingAddress.street}, ${order.shippingAddress.city}` : 'N/A';
            
            // Create status dropdown trigger element
            return `
              <tr>
                <td style="font-family: monospace; font-size:12px;">#${order._id.substring(18)}</td>
                <td>${customerName}</td>
                <td>${dateStr}</td>
                <td style="font-weight:700;">$${order.totalAmount.toFixed(2)}</td>
                <td style="font-size:13px; color: var(--text-secondary); max-width: 180px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${addr}</td>
                <td>
                  <select class="form-control admin-status-select" data-id="${order._id}" style="width:130px; padding: 4px 8px; font-size:13px;">
                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="paid" ${order.status === 'paid' ? 'selected' : ''}>Paid</option>
                    <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                  </select>
                </td>
              </tr>
            `;
          }).join('');

          // Hook status selector changes
          document.querySelectorAll('.admin-status-select').forEach(select => {
            select.addEventListener('change', async (e) => {
              const orderId = select.getAttribute('data-id');
              const newStatus = e.target.value;

              try {
                const updateRes = await apiRequest(`/api/orders/${orderId}/status`, {
                  method: 'PUT',
                  body: JSON.stringify({ status: newStatus }),
                });

                if (updateRes.success) {
                  showToast('Order status updated successfully!', 'success');
                  await loadAdminOrders();
                }
              } catch (err) {
                console.error(err);
              }
            });
          });
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--danger-color);">Error loading order records.</td></tr>';
      }
    }
  </script>
</body>
</html>
