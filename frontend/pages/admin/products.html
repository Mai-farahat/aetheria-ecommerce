<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | Aetheria Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span> ADMIN</a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">View Site</a></li>
      </ul>
      <div class="nav-actions">
        <ul class="nav-links" id="nav-auth-links">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Admin Main Dashboard Container -->
  <main class="container admin-layout">
    
    <!-- Sidebar navigation -->
    <aside class="card admin-sidebar">
      <ul style="list-style: none;">
        <li><a href="/pages/admin/dashboard.html" class="admin-nav-item">Dashboard Overview</a></li>
        <li><a href="/pages/admin/products.html" class="admin-nav-item active">Manage Products</a></li>
        <li><a href="/pages/admin/orders.html" class="admin-nav-item">Manage Orders</a></li>
      </ul>
    </aside>

    <!-- Admin Content Area -->
    <section>
      <div class="section-header flex-between">
        <h1 class="section-title">Manage Products</h1>
        <button id="add-product-btn" class="btn btn-primary">Add Product</button>
      </div>

      <!-- Products Grid List -->
      <div class="card">
        <div class="table-responsive">
          <table class="table" id="admin-products-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-secondary);">Loading catalog items...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Dialog for Creating / Editing Products -->
  <div class="modal" id="product-modal">
    <div class="card modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size:20px;">Add New Product</h3>
        <span class="close-btn" id="close-modal-btn">&times;</span>
      </div>
      <form id="product-form" enctype="multipart/form-data">
        <input type="hidden" id="product-id">
        
        <div class="form-group">
          <label for="prod-name">Product Name</label>
          <input type="text" id="prod-name" class="form-control" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prod-price">Price ($)</label>
            <input type="number" id="prod-price" class="form-control" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label for="prod-stock">Stock level</label>
            <input type="number" id="prod-stock" class="form-control" min="0" required>
          </div>
        </div>

        <div class="form-group">
          <label for="prod-category">Category</label>
          <select id="prod-category" class="form-control" required>
            <option value="">Select Category</option>
            <!-- Loaded dynamically -->
          </select>
        </div>

        <div class="form-group">
          <label for="prod-desc">Description</label>
          <textarea id="prod-desc" class="form-control" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="prod-images">Product Image Upload</label>
          <input type="file" id="prod-images" class="form-control" accept="image/*" multiple style="padding: 8px;">
          <p style="font-size:12px; color: var(--text-secondary); margin-top:4px;">Upload images (leave empty to keep current or use fallback).</p>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; height:44px;">Save Product</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. Admin operations center.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { apiRequest, showToast } from '/js/api.js';
    import { isAuthenticated, isAdmin } from '/js/auth.js';

    let categoriesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // Security Guard Route
      if (!isAuthenticated() || !isAdmin()) {
        window.location.href = '/pages/login.html';
        return;
      }

      await loadCategories();
      await loadAdminProducts();

      // Open Modal on Add Product
      const modal = document.getElementById('product-modal');
      document.getElementById('add-product-btn').addEventListener('click', () => {
        document.getElementById('product-id').value = '';
        document.getElementById('product-form').reset();
        document.getElementById('modal-title').innerText = 'Add New Product';
        modal.style.display = 'flex';
      });

      // Close Modal on Close click
      document.getElementById('close-modal-btn').addEventListener('click', () => {
        modal.style.display = 'none';
      });

      // Form Submit
      document.getElementById('product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('product-id').value;
        const name = document.getElementById('prod-name').value;
        const price = document.getElementById('prod-price').value;
        const stock = document.getElementById('prod-stock').value;
        const category = document.getElementById('prod-category').value;
        const description = document.getElementById('prod-desc').value;
        const fileInput = document.getElementById('prod-images');

        // Form Data is required for uploading files
        const formData = new FormData();
        formData.append('name', name);
        formData.append('price', price);
        formData.append('stock', stock);
        formData.append('category', category);
        formData.append('description', description);

        if (fileInput.files.length > 0) {
          for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('images', fileInput.files[i]);
          }
        }

        try {
          let res;
          const headers = {}; // Content-Type is auto-managed by FormData in browsers

          if (id) {
            // Edit Mode
            res = await apiRequest(`/api/products/${id}`, {
              method: 'PUT',
              body: formData,
            });
          } else {
            // Create Mode
            res = await apiRequest('/api/products', {
              method: 'POST',
              body: formData,
            });
          }

          if (res.success) {
            showToast(id ? 'Product updated!' : 'Product added!', 'success');
            modal.style.display = 'none';
            await loadAdminProducts();
          }
        } catch (err) {
          console.error(err);
        }
      });
    });

    async function loadCategories() {
      try {
        const res = await apiRequest('/api/products/categories');
        if (res.success) {
          categoriesList = res.data;
          const select = document.getElementById('prod-category');
          select.innerHTML = '<option value="">Select Category</option>' + 
            categoriesList.map(c => `<option value="${c._id}">${c.name}</option>`).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadAdminProducts() {
      const tbody = document.getElementById('admin-products-tbody');
      try {
        const res = await apiRequest('/api/products');
        if (res.success) {
          const products = res.data.products;
          if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No products in catalog.</td></tr>';
            return;
          }

          tbody.innerHTML = products.map(prod => {
            const img = (prod.images && prod.images.length > 0) ? prod.images[0] : '';
            return `
              <tr>
                <td><img src="${img}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%231a1a2e%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236366f1%22 font-family=%22sans-serif%22 font-size=%2220%22 font-weight=%22bold%22>Aetheria</text></svg>';" style="width:50px; height:50px; object-fit:cover; border-radius:4px; background-color: var(--bg-input);"></td>
                <td style="font-weight:600;">${prod.name}</td>
                <td>${prod.category ? prod.category.name : 'Uncategorized'}</td>
                <td style="font-weight:700;">$${prod.price.toFixed(2)}</td>
                <td style="color: ${prod.stock > 0 ? 'var(--text-primary)' : 'var(--danger-color)'};">${prod.stock}</td>
                <td>
                  <button class="btn btn-secondary btn-sm" onclick="editProduct('${prod._id}')">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteProduct('${prod._id}')" style="margin-left: 6px;">Delete</button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--danger-color);">Error loading catalog.</td></tr>';
      }
    }

    // Modal populate edit mode trigger
    window.editProduct = async (id) => {
      const modal = document.getElementById('product-modal');
      try {
        const res = await apiRequest(`/api/products/${id}`);
        if (res.success) {
          const prod = res.data;
          document.getElementById('product-id').value = prod._id;
          document.getElementById('prod-name').value = prod.name;
          document.getElementById('prod-price').value = prod.price;
          document.getElementById('prod-stock').value = prod.stock;
          document.getElementById('prod-category').value = prod.category ? prod.category._id : '';
          document.getElementById('prod-desc').value = prod.description;
          
          document.getElementById('modal-title').innerText = 'Edit Product Details';
          modal.style.display = 'flex';
        }
      } catch (err) {
        console.error(err);
      }
    };

    window.deleteProduct = async (id) => {
      if (confirm('Are you absolutely sure you want to delete this product?')) {
        try {
          const res = await apiRequest(`/api/products/${id}`, {
            method: 'DELETE',
          });
          if (res.success) {
            showToast('Product deleted successfully', 'success');
            await loadAdminProducts();
          }
        } catch (err) {
          console.error(err);
        }
      }
    };
  </script>
</body>
</html>
