<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Aetheria</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container nav-container">
      <a href="/pages/index.html" class="logo">AETHERIA<span>.</span></a>
      <ul class="nav-links">
        <li><a href="/pages/index.html" class="nav-item">Home</a></li>
        <li><a href="/pages/product.html" class="nav-item">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/pages/cart.html" class="cart-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
        <ul class="nav-links" id="nav-auth-links" style="margin-left: 20px;">
          <!-- Loaded dynamically -->
        </ul>
      </div>
    </div>
  </header>

  <!-- Cart Content Area -->
  <main class="container">
    <div class="section-header">
      <h1 class="section-title">Your Shopping Cart</h1>
    </div>

    <div class="cart-layout" id="cart-layout-container">
      <!-- Loaded dynamically -->
      <div class="card" style="grid-column: 1/-1; text-align:center; padding: 40px;">
        Checking cart items...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Aetheria. All rights reserved. Powered by Node.js & MongoDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module">
    import { getCartItems, getCartSubtotal, updateCartQty, removeFromCart } from '/js/cart.js';
    import { isAuthenticated } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });

    function renderCart() {
      const container = document.getElementById('cart-layout-container');
      const items = getCartItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card" style="grid-column: 1/-1; text-align:center; padding: 60px;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <h2 style="font-size: 22px; margin-bottom: 8px;">Your cart is empty</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Looks like you haven't added anything to your cart yet.</p>
            <a href="/pages/product.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      const itemsHtml = items.map(item => `
        <div class="cart-item">
          <img src="${item.image}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%231a1a2e%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236366f1%22 font-family=%22sans-serif%22 font-size=%2220%22 font-weight=%22bold%22>Aetheria</text></svg>';" class="cart-item-image" alt="${item.name}">
          <div class="cart-item-info">
            <h3 class="cart-item-name"><a href="/pages/product-detail.html?id=${item.product}">${item.name}</a></h3>
            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
          </div>
          <div class="qty-selector" style="margin: 0 16px;">
            <button class="qty-btn dec-qty-btn" data-id="${item.product}">-</button>
            <input type="number" class="qty-input item-qty-val" data-id="${item.product}" value="${item.qty}" readonly>
            <button class="qty-btn inc-qty-btn" data-id="${item.product}">+</button>
          </div>
          <div style="font-weight: 700; font-size:16px; min-width:80px; text-align:right;">
            $${(item.qty * item.price).toFixed(2)}
          </div>
          <button class="btn btn-secondary btn-sm remove-item-btn" data-id="${item.product}" style="padding: 8px; margin-left: 12px; color: var(--danger-color); border-color: transparent;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
      `).join('');

      const summaryHtml = `
        <div class="card" style="height: fit-content;">
          <h2 style="font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">Order Summary</h2>
          <div class="flex-between" style="margin-bottom: 12px;">
            <span style="color: var(--text-secondary);">Items count:</span>
            <span>${items.reduce((acc, item) => acc + item.qty, 0)}</span>
          </div>
          <div class="flex-between" style="margin-bottom: 24px; font-weight: 700; font-size: 18px;">
            <span>Subtotal:</span>
            <span>$${getCartSubtotal()}</span>
          </div>
          <button class="btn btn-primary" id="checkout-btn" style="width: 100%;">Proceed to Checkout</button>
          <a href="/pages/product.html" class="btn btn-secondary" style="width: 100%; margin-top: 12px; text-align:center;">Continue Shopping</a>
        </div>
      `;

      container.innerHTML = `
        <div class="cart-items-list">
          ${itemsHtml}
        </div>
        <div>
          ${summaryHtml}
        </div>
      `;

      // Set event listeners
      document.querySelectorAll('.dec-qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const input = document.querySelector(`.item-qty-val[data-id="${id}"]`);
          updateCartQty(id, parseInt(input.value) - 1);
          renderCart();
        });
      });

      document.querySelectorAll('.inc-qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const input = document.querySelector(`.item-qty-val[data-id="${id}"]`);
          updateCartQty(id, parseInt(input.value) + 1);
          renderCart();
        });
      });

      document.querySelectorAll('.remove-item-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          removeFromCart(id);
          renderCart();
        });
      });

      document.getElementById('checkout-btn').addEventListener('click', () => {
        if (!isAuthenticated()) {
          window.location.href = `/pages/login.html?redirect=${encodeURIComponent('/pages/checkout.html')}`;
        } else {
          window.location.href = '/pages/checkout.html';
        }
      });
    }
  </script>
</body>
</html>
